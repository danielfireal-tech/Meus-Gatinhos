<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Fichas dos Gatos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f2f2f2;
      color: #333;
      text-align: center;
    }

    h1 {
      color: #2c3e50;
    }

    /* Container geral */
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    /* Cartão dos gatos */
    .gato {
      background-color: white;
      border-radius: 8px;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 350px;
      text-align: left;
      position: relative;
    }

    h2 {
      color: #2c3e50;
      margin-top: 0;
    }

    p {
      margin: 6px 0;
    }

    .dias-vida {
      font-weight: bold;
      color: #e67e22;
    }

    img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
    }

    /* Botão de excluir */
    .excluir {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: bold;
    }

    .excluir:hover {
      background-color: #c0392b;
    }

    /* Formulário */
    .formulario {
      background-color: white;
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      margin: 30px auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }

    .formulario input, .formulario textarea, .formulario button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .formulario button {
      background-color: #2c3e50;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .formulario button:hover {
      background-color: #34495e;
    }
  </style>
</head>
<body>
  <h1>Fichas dos Gatos</h1>

  <div class="container" id="lista-gatos"></div>

  <!-- Formulário -->
  <div class="formulario">
    <h2>Adicionar novo gato 🐾</h2>
    <input type="text" id="nome" placeholder="Nome do gato" required>
    <input type="date" id="nascimento" required>
    <input type="file" id="foto" accept="image/*">
    <textarea id="observacoes" placeholder="Observações"></textarea>
    <button onclick="adicionarGato()">Adicionar Gato</button>
  </div>

  <script>
    // Calcula dias de vida
    function calcularDiasVida(dataNascimentoStr) {
      const dataNascimento = new Date(dataNascimentoStr + 'T00:00:00');
      const hoje = new Date();
      const diffTime = hoje - dataNascimento;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      return diffDays >= 0 ? diffDays : 0;
    }

    // Carrega gatos do localStorage
    function carregarGatos() {
      const lista = document.getElementById('lista-gatos');
      lista.innerHTML = ''; // limpa antes de renderizar

      const gatos = JSON.parse(localStorage.getItem('gatos') || '[]');
      gatos.forEach((gato, index) => {
        const div = document.createElement('div');
        div.classList.add('gato');
        div.innerHTML = `
          <button class="excluir" onclick="excluirGato(${index})">×</button>
          <h2>${gato.nome}</h2>
          ${gato.foto ? `<img src="${gato.foto}" alt="${gato.nome}">` : ''}
          <p><strong>Data de nascimento:</strong> ${new Date(gato.nascimento).toLocaleDateString('pt-BR')}</p>
          <p><strong>Idade atual:</strong> <span class="dias-vida">${calcularDiasVida(gato.nascimento)}</span> dias de vida</p>
          <p><strong>Observações:</strong> ${gato.observacoes || 'Sem observações'}</p>
        `;
        lista.appendChild(div);
      });
    }

    // Adiciona novo gato
    function adicionarGato() {
      const nome = document.getElementById('nome').value.trim();
      const nascimento = document.getElementById('nascimento').value;
      const fotoInput = document.getElementById('foto');
      const observacoes = document.getElementById('observacoes').value.trim();

      if (!nome || !nascimento) {
        alert('Por favor, preencha nome e data de nascimento.');
        return;
      }

      const gatos = JSON.parse(localStorage.getItem('gatos') || '[]');

      // Função para salvar gato no localStorage
      function salvarGato(fotoBase64 = '') {
        gatos.push({ nome, nascimento, foto: fotoBase64, observacoes });
        localStorage.setItem('gatos', JSON.stringify(gatos));
        carregarGatos();

        // Limpa o formulário
        document.getElementById('nome').value = '';
        document.getElementById('nascimento').value = '';
        document.getElementById('foto').value = '';
        document.getElementById('observacoes').value = '';
      }

      // Se tiver imagem, converte para base64 antes de salvar
      if (fotoInput.files && fotoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          salvarGato(e.target.result);
        };
        reader.readAsDataURL(fotoInput.files[0]);
      } else {
        salvarGato();
      }
    }

    // Exclui gato
    function excluirGato(index) {
      const gatos = JSON.parse(localStorage.getItem('gatos') || '[]');
      if (confirm(`Deseja realmente excluir ${gatos[index].nome}?`)) {
        gatos.splice(index, 1);
        localStorage.setItem('gatos', JSON.stringify(gatos));
        carregarGatos();
      }
    }

    // Inicializa com alguns exemplos se estiver vazio
    if (!localStorage.getItem('gatos')) {
      const exemplo = [
        {
          nome: "Frajola Copinho",
          nascimento: "2025-08-27",
          foto: "frajola.jpg",
          observacoes: "Gato preto com patas brancas e olhos cinzas"
        },
        {
          nome: "Nial Caixinha",
          nascimento: "2025-08-27",
          foto: "nial.jpg",
          observacoes: "Gato branco com manchas cinzas claras"
        }
      ];
      localStorage.setItem('gatos', JSON.stringify(exemplo));
    }

    // Carrega tudo ao abrir a página
    carregarGatos();
  </script>
</body>
</html>
